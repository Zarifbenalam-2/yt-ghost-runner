name: Cloud Ghost Watcher Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      tabs_per_runner:
        description: 'Number of tabs per runner VM'
        required: true
        default: '5'
      stream_target:
        description: 'Dashboard Webhook/Relay URL for live screen frames (Optional)'
        required: false
        default: ''

jobs:
  cloud-watch:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner_id: [1, 2, 3, 4]  # Scales across 4 runners (e.g. 4 runners x 5 tabs = 20 concurrent streams)
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Xvfb & CloakBrowser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install cloakbrowser
          npx cloakbrowser install || python -c "import cloakbrowser; print('cloakbrowser installed')"

      - name: Install Playwright System Dependencies
        run: |
          pip install playwright
          playwright install-deps chromium

      - name: Install cloudflared (quick tunnel, no account)
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Run Ghost Watcher in Virtual 1080p Display
        env:
          CI: "true"
          RUNNER_ID: ${{ matrix.runner_id }}
          STREAM_TARGET_URL: ${{ github.event.inputs.stream_target || '' }}
        run: |
          mkdir -p data
          # Live frame relay + ephemeral public URL (runner-initiated, dies with job)
          nohup python relay.py --port 8899 > relay.log 2>&1 &
          echo $! > relay.pid
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8899 > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          echo "TUNNEL_URL=${TUNNEL_URL}"
          echo "${TUNNEL_URL}" > data/tunnel_url_${{ matrix.runner_id }}.txt
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python ghost_watch.py \
              --url "${{ github.event.inputs.video_url || 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' }}" \
              --tabs ${{ github.event.inputs.tabs_per_runner || '10' }} \
              --depth-lo 60 \
              --depth-hi 95
          kill $(cat relay.pid) $(cat cloudflared.pid) 2>/dev/null || true

      - name: Upload Run Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-report-runner-${{ matrix.runner_id }}
          path: |
            data/run_report_${{ matrix.runner_id }}.json
            data/live_feed.json
            data/tunnel_url_${{ matrix.runner_id }}.txt
          if-no-files-found: warn
